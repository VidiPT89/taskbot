[project]
name = "taskbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Martins", email = "damartins89@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.28.0",
]

[project.scripts]
taskbot = "taskbot.cli:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
